<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Colorado Streamflow Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 1rem;
      background: #f4f6f8;
    }
    h1 {
      text-align: center;
    }
    .gauge-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }
    .gauge-card {
      background: white;
      border-radius: 8px;
      padding: 1rem;
      width: 300px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .gauge-card h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }
    .error {
      color: #b00020;
      font-weight: bold;
    }
    .loading {
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Colorado Streamflow Dashboard</h1>
  <div class="gauge-container" id="dashboard"></div>

<script>
  // List of gauge site IDs to query (South Platte, Arkansas, Rocky Mountain NP areas)
  // Adjust or add site IDs as needed.
  const gauges = [
    { id: '06730200', name: 'South Platte River near Kersey' },
    { id: '07065000', name: 'Arkansas River near Salida' },
    { id: '09085000', name: 'Colorado River near Granby (Rocky Mtn NP area)' },
    { id: '09053000', name: 'Big Thompson River near Drake' }
  ];

  const dashboard = document.getElementById('dashboard');

  // Fetch data for one gauge with timeout of 10 sec
  function fetchGaugeData(siteId) {
    const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteId}&parameterCd=00060,00010&siteStatus=active`;

    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        reject(new Error('Timeout'));
      }, 10000);

      fetch(url)
        .then(response => {
          clearTimeout(timer);
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          return response.json();
        })
        .then(data => resolve(data))
        .catch(err => {
          clearTimeout(timer);
          reject(err);
        });
    });
  }

  // Parse the returned USGS JSON for the relevant data points
  function parseGaugeData(data) {
    try {
      const timeSeries = data.value.timeSeries;
      if (!timeSeries || timeSeries.length === 0) return null;

      // Find discharge (00060) and water temp (00010)
      let discharge = null;
      let waterTemp = null;
      let dateTime = null;

      for (let ts of timeSeries) {
        const param = ts.variable.variableCode[0].value;
        const points = ts.values[0].value;
        if (points.length === 0) continue;
        // Use last value
        const latestValue = points[points.length - 1];
        dateTime = latestValue.dateTime;

        if (param === '00060') {
          discharge = latestValue.value;
        }
        if (param === '00010') {
          waterTemp = latestValue.value;
        }
      }
      return { discharge, waterTemp, dateTime };
    } catch {
      return null;
    }
  }

  // Create a gauge card
  function createGaugeCard(name, data, error=null) {
    const card = document.createElement('div');
    card.className = 'gauge-card';

    const title = document.createElement('h2');
    title.textContent = name;
    card.appendChild(title);

    if (error) {
      const errMsg = document.createElement('p');
      errMsg.className = 'error';
      errMsg.textContent = `Error: ${error}`;
      card.appendChild(errMsg);
    } else if (data) {
      const disp = document.createElement('p');
      disp.textContent = `Discharge (cfs): ${data.discharge !== null ? data.discharge : 'N/A'}`;

      const temp = document.createElement('p');
      temp.textContent = `Water Temperature (°C): ${data.waterTemp !== null ? data.waterTemp : 'N/A'}`;

      const time = document.createElement('p');
      const dt = new Date(data.dateTime);
      time.textContent = `Last updated: ${dt.toLocaleString()}`;

      card.appendChild(disp);
      card.appendChild(temp);
      card.appendChild(time);
    } else {
      const loading = document.createElement('p');
      loading.className = 'loading';
      loading.textContent = 'Loading...';
      card.appendChild(loading);
    }

    return card;
  }

  // Initialize dashboard with loading placeholders
  gauges.forEach(g => {
    const card = createGaugeCard(g.name, null);
    dashboard.appendChild(card);
  });

  // Load data independently with timeout and update cards
  gauges.forEach((g, idx) => {
    fetchGaugeData(g.id)
      .then(data => {
        const parsed = parseGaugeData(data);
        const newCard = createGaugeCard(g.name, parsed);
        dashboard.replaceChild(newCard, dashboard.children[idx]);
      })
      .catch(err => {
        const newCard = createGaugeCard(g.name, null, err.message);
        dashboard.replaceChild(newCard, dashboard.children[idx]);
      });
  });
</script>
</body>
</html>
